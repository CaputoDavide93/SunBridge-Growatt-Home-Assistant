name: Dependency Review

# Refuses a pull request that adds a dependency (Python or GitHub Actions)
# with a known vulnerability.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: Review new dependencies
    # GitHub offers dependency review on public repositories only.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
